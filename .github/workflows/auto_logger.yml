name: NSE Arbitrage Auto-Logger

on:
  schedule:
    - cron: '*/15 3-10 * * 1-5' # Runs every 15 mins Mon-Fri during IST market hours
  workflow_dispatch:

permissions:
  contents: write  # <-- ADD THIS LINE TO ALLOW COMMITS

jobs:
  log-market-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas yfinance numpy streamlit

      - name: Run Logger Script
        run: python app.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add arbitrage_log.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-log: Updated arbitrage market state" && git push)
